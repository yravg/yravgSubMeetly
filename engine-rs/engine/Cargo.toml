[package]
name = "submeetly-engine"
version = "0.1.0"
edition = "2021"
description = "Loopback engine for yravgSubMeetly: non-ML HTTP routes and Native Messaging host"

[[bin]]
name = "submeetly-engine"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
