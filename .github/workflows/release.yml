# Starts only when a tag v* is pushed (island/docs/updates.md, "Publishing a release"). It builds the
# Windows Setup and the Mac DMG in parallel, then publishes one release with both and a signed
# latest.json. Needs the repository secret UPDATE_FEED_KEY (the PEM text of the private signing key)
# in the `release` environment. Nothing is published unless both builds pass.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the version in island/Cargo.toml
        shell: pwsh
        run: |
          $v = (Select-String -Path island/Cargo.toml -Pattern '^version = "([0-9.]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ("v$v" -ne $env:GITHUB_REF_NAME) { throw "tag $env:GITHUB_REF_NAME does not match Cargo.toml version $v" }
          "VERSION=$v" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            island
            engine-rs

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The Setup carries the built Chrome extension (build-installer.ps1 runs `npm run build`).
      - name: Install the extension's dependencies
        run: npm ci

      # The installer's wizard images need Inno Setup 6.5+ (the runner image may carry an older 6.x).
      - name: Inno Setup 6.5+
        shell: pwsh
        run: choco upgrade innosetup -y --no-progress

      # (build-installer.ps1 runs the add-on pin tests of poni-core itself.)
      # Builds poni.exe and submeetly-engine.exe, then runs ISCC (Inno Setup 6 is on the runner image).
      - name: Build the Setup
        shell: pwsh
        run: island/tools/build-installer.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: island/dist/yravgSubMeetly-Setup-*.exe
          if-no-files-found: error

  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the version in island/Cargo.toml
        run: |
          v="$(sed -n 's/^version = "\([0-9.]*\)".*/\1/p' island/Cargo.toml | head -1)"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $v"; exit 1; }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            island
            engine-rs

      - name: Tests
        working-directory: island
        run: cargo test -p poni-core

      - name: Build (Apple Silicon and Intel)
        working-directory: island
        run: |
          cargo build -p poni --release --target aarch64-apple-darwin
          cargo build -p poni --release --target x86_64-apple-darwin

      # The local engine (captions, translation, the model library) goes inside the app.
      - name: Build the engine (Apple Silicon and Intel)
        working-directory: engine-rs
        run: |
          cargo build -p submeetly-engine --release --target aarch64-apple-darwin
          cargo build -p submeetly-engine --release --target x86_64-apple-darwin

      - name: App icon
        working-directory: island
        run: |
          python3 -m venv .icon-venv
          .icon-venv/bin/pip install --quiet pillow
          .icon-venv/bin/python tools/make_mac_icon.py build/yravgSubMeetly.iconset
          iconutil -c icns build/yravgSubMeetly.iconset -o build/yravgSubMeetly.icns

      - name: App bundle and DMG (ad-hoc signed until a Developer ID exists)
        working-directory: island
        env:
          ENGINE_ARM: ${{ github.workspace }}/engine-rs/target/aarch64-apple-darwin/release/submeetly-engine
          ENGINE_INTEL: ${{ github.workspace }}/engine-rs/target/x86_64-apple-darwin/release/submeetly-engine
        run: tools/make_mac_app.sh target/aarch64-apple-darwin/release/poni target/x86_64-apple-darwin/release/poni build/yravgSubMeetly.icns dist

      - name: Update in place (the app replaces itself)
        working-directory: island
        run: bash tools/mac-update-test.sh "dist/yravgSubMeetly.app"

      - uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: island/dist/yravgSubMeetly-*-mac.dmg
          if-no-files-found: error

  publish:
    needs: [windows, mac]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Publish the release with the Setup and the DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la assets
          gh release create "$GITHUB_REF_NAME" assets/* --title "$GITHUB_REF_NAME" --generate-notes

      # latest.json describes the release just published (it reads each asset's size and SHA-256 from
      # GitHub) and is signed with the secret key; the app trusts only the public keys in
      # crates/poni-core/data/update-keys.txt.
      - name: Sign latest.json and attach it
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_FEED_KEY: ${{ secrets.UPDATE_FEED_KEY }}
        run: |
          python3 island/tools/make_update_feed.py latest.json
          gh release upload "$GITHUB_REF_NAME" latest.json --clobber
