<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kasi social image</title>
<!-- Source of site/assets/og.png (1200x630). Rebuild with: node site/brand/icons/build.cjs
     Kasi is drawn live by ../kasi.js. The caption is the page demo's sample call. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@800;900&family=Figtree:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0C0B09; --text: #F6F1E8; --text-2: #C2B8A9; --text-3: #978D7F; --yellow: #FFD23F; --pill: #000;
    --display: 'Gabarito', 'Figtree', system-ui, sans-serif; --body: 'Figtree', system-ui, sans-serif;
  }
  html, body { margin: 0; background: var(--bg); }
  .og {
    position: relative; width: 1200px; height: 630px; overflow: hidden; color: var(--text); font-family: var(--body);
    -webkit-font-smoothing: antialiased;
    /* the pill's own light on the ground, nothing more */
    background: radial-gradient(560px 360px at 905px 70px, rgba(255, 210, 63, .085), transparent 70%), var(--bg);
  }

  /* left: name and headline */
  .copy { position: absolute; left: 80px; top: 72px; bottom: 72px; width: 560px; display: flex; flex-direction: column; }
  .lock { display: flex; align-items: center; gap: 12px; font: 800 34px/1 var(--display); letter-spacing: -0.03em; white-space: nowrap; }
  .lock .mk { width: 58px; height: 58px; display: block; margin-top: -6px; }
  .lock .mk svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .lock .yr { color: var(--text-3); font-weight: 700; }
  h1 { margin: auto 0 0; font: 900 84px/.95 var(--display); letter-spacing: -0.04em; text-wrap: balance; }
  h1 span { display: block; }
  h1 .y { color: var(--yellow); }
  .sub { margin-top: 26px; font: 500 25px/1.35 var(--body); color: var(--text-2); }

  /* right: the pill at the top edge, Kasi hanging under it */
  .island { position: absolute; top: 22px; left: 905px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; }
  .pill {
    position: relative; z-index: 1; width: 470px; padding: 18px 26px 22px; border-radius: 30px; background: var(--pill); color: #fff;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, .09), 0 26px 60px -20px rgba(0, 0, 0, .95);
  }
  .p-head { display: flex; align-items: center; gap: 10px; font: 700 14px/1 var(--body); letter-spacing: .07em; text-transform: uppercase; color: rgba(255, 255, 255, .58); }
  .rec { width: 10px; height: 10px; border-radius: 50%; background: #FF5A4E; box-shadow: 0 0 0 5px rgba(255, 90, 78, .2); flex: none; }
  .lines { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  .line { font: 500 20px/1.3 var(--body); color: rgba(255, 255, 255, .5); white-space: nowrap; overflow: hidden; }
  .line b { font: 700 13px/1 var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); margin-right: 9px; vertical-align: 2px; }
  .line.now { font-size: 25px; font-weight: 600; color: #fff; }
  .caret { display: inline-block; width: 3px; height: 1.02em; background: var(--yellow); vertical-align: -4px; margin-left: 3px; border-radius: 1px; }
  .hanger { position: relative; z-index: 2; width: 290px; aspect-ratio: 300 / 470; margin-top: -52px; /* 0.18 of its width: hands on the pill's lower edge */ }
  .hanger svg { width: 100%; height: 100%; display: block; overflow: visible; }
</style>
</head>
<body>
<div class="og">
  <div class="copy">
    <div class="lock"><span class="mk" id="mark"></span><span>Kasi <span class="yr" style="font-size:.5em;font-weight:600;letter-spacing:0">by yravg</span></span></div>
    <h1 data-fit><span>Every word,</span><span class="y">right where you look.</span></h1>
    <p class="sub">Live captions and minutes, on your computer.</p>
  </div>
  <div class="island">
    <div class="pill">
      <div class="p-head"><span class="rec"></span>Live · Teams call</div>
      <div class="lines">
        <div class="line" data-fit><b>Wei Jie</b>Can we ship it on Friday?</div>
        <div class="line now" data-fit><b>Alya</b>Yes, if Dimas books the demo<span class="caret"></span></div>
      </div>
    </div>
    <div class="hanger" id="hanger"></div>
  </div>
</div>
<script src="../kasi.js"></script>
<script>
  document.getElementById('mark').innerHTML = Kasi.svg({ pose: 'mark', mouth: 'small', uid: 'og-mark' });
  document.getElementById('hanger').innerHTML = Kasi.svg({ pose: 'hang', uid: 'og-hang' });
  document.fonts.ready.then(() => { document.body.dataset.ready = '1'; });
</script>
</body>
</html>
