<!doctype html>

<head>

<div class="app" id="app">

      <img src="tide/01-tide-mark-green.svg" alt="" width="30" height="30" />
      <span class="wm">yravg<i>SubMeetly</i></span>
      <button type="button" class="icon-b bell" id="btn-bell" aria-haspopup="dialog" aria-expanded="false"></button>
      <button type="button" class="icon-b sb-close" id="btn-sb-close"></button>
    </div>
    <label class="series hide-rail">
      <span class="av" id="series-av" aria-hidden="true"></span>
      <select id="series-select"></select>
    </label>
    <button type="button" class="askf" id="ask-field"></button>
    <div class="sec hide-rail" data-t="meetings"></div>
    <nav class="nav" id="nav-meetings"></nav>
    <div class="sec hide-rail" data-t="features"></div>

      <span class="grow"></span>
      <label class="chip sw-chip" id="island-chip"><span class="ic-slot" data-ic="island"></span><span data-t="island"></span><input type="checkbox" role="switch" id="island-switch" /></label>
      <a class="chip" id="helper-pill" href="#helper"><span class="dot" id="helper-dot"></span><span id="helper-pill-text"></span></a>
    </div>
    <div id="page" class="page" tabindex="-1"></div>

<div class="pop" id="bell-pop" role="dialog" hidden></div>
<script type="module" src="app.js"></script>
