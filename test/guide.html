<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Panduan pengguna — yraverageSubMin</title>
<link rel="stylesheet" href="/dist/tokens.css" />
        <link rel="stylesheet" href="/dist/sidepanel.css" />
    <style>
      /* Halaman ini MERENDER docs/USER-GUIDE.md, tidak menyalinnya. Satu sumber:
         mengubah panduan cukup di berkas Markdown-nya. */
      body {
        margin: 0;
        background: var(--bg, #1e1e1e);
        color: var(--text, #ededed);
        font: 15px/1.65 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      .wrap { max-width: 820px; margin: 0 auto; padding: 32px 20px 96px; }
      .crumb {
        display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
        font-size: 13px; color: var(--muted, #b4b4b4); margin-bottom: 24px;
      }
      .crumb a { color: var(--accent-soft, #6ce0b8); }
      h1 { font-size: 28px; margin: 0 0 12px; line-height: 1.25; }
      h2 {
        font-size: 20px; margin: 34px 0 10px; padding-top: 14px;
        border-top: 1px solid var(--border, #3a3a3a);
      }
      h3 { font-size: 16px; margin: 22px 0 8px; color: var(--accent-soft, #6ce0b8); }
      p { margin: 10px 0; }
      ul, ol { margin: 10px 0; padding-left: 22px; }
      li { margin: 5px 0; }
      hr { border: 0; height: 0; margin: 0; }
      code {
        background: var(--card3, #2c2c2c); padding: 1px 5px; border-radius: 4px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.9em;
      }
      pre {
        background: var(--card2, #292929); border: 1px solid var(--border, #3a3a3a);
        border-radius: 8px; padding: 12px 14px; overflow-x: auto;
      }
      pre code { background: none; padding: 0; }
      /* Tabel lebar harus menggulir sendiri, bukan mendorong halaman. */
      .table-wrap { overflow-x: auto; margin: 12px 0; }
      table { border-collapse: collapse; width: 100%; font-size: 14px; }
      th, td {
        border: 1px solid var(--border, #3a3a3a); padding: 7px 10px;
        text-align: left; vertical-align: top;
      }
      th { background: var(--card2, #292929); font-weight: 600; }
      a { color: var(--accent-soft, #6ce0b8); }
      #err {
        border: 1px solid #a44; background: #2a1d1d; border-radius: 8px;
        padding: 14px 16px; white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="crumb">
        <a href="/app.html">← Panel (app.html)</a>
        <span>·</span>
        <a href="/">Semua halaman uji</a>
        <span>·</span>
        <span id="doc-nav"></span>
        <span>·</span>
        <a id="md-src" href="/docs/USER-GUIDE.md">Sumber Markdown</a>
      </div>
      <div id="doc">Memuat panduan…</div>
    </div>

    <script type="module">
      import { renderMarkdown } from '/mini-markdown.js';

      // Allowlist: ?doc= tidak boleh menjadi jalan untuk mengambil berkas
      // sembarangan dari server lab.
      const DOCS = [
        { file: 'USER-GUIDE.md', label: 'Ekstensi Chrome' },
        { file: 'USER-GUIDE-MACOS.md', label: 'Aplikasi macOS' },
        { file: 'USER-GUIDE-WINLINUX.md', label: 'Windows & Linux' },
      ];
      const want = new URLSearchParams(location.search).get('doc');
      const doc = DOCS.find((d) => d.file === want) || DOCS[0];

      const nav = document.getElementById('doc-nav');
      for (const d of DOCS) {
        if (d.file === doc.file) {
          const b = document.createElement('b');
          b.textContent = d.label;
          nav.append(b, ' ');
        } else {
          const a = document.createElement('a');
          a.href = `/guide.html?doc=${encodeURIComponent(d.file)}`;
          a.textContent = d.label;
          nav.append(a, ' ');
        }
      }
      document.getElementById('md-src').href = `/docs/${doc.file}`;

      const mount = document.getElementById('doc');
      try {
        const res = await fetch(`/docs/${doc.file}`);
        if (!res.ok) throw new Error(`docs/${doc.file} → HTTP ${res.status}`);
        mount.innerHTML = renderMarkdown(await res.text());
        document.title = (document.querySelector('#doc h1')?.textContent || document.title).trim();
      } catch (e) {
        mount.innerHTML = '';
        const box = document.createElement('div');
        box.id = 'err';
        box.textContent =
          `Panduan tidak bisa dimuat: ${e.message}\n\n` +
          'Jalankan lab lewat scripts/lab-server.py — halaman ini membaca /docs/.';
        mount.appendChild(box);
      }
    </script>
  </body>
</html>
