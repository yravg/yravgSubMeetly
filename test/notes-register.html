<!doctype html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Minutes Register</title>
<style>
/* ==========================================================================
   yraverageSubMin — Minutes Register (Facilitator-class notes surface)
   Design tokens extend src/sidepanel.css (charcoal + emerald). Committed
   single-theme dark: the product is a dark Chrome surface, so every colour
   is painted explicitly rather than inherited from the host.
   ========================================================================== */
:root{
  /* --- carried over verbatim from src/sidepanel.css --- */
  --bg:#181818;
  --card:#1f1f1f;
  --card2:#292929;
  --card3:#2c2c2c;
  --border:#3a3a3a;
  --text:#f5f5f5;
  --text2:#e8e8e8;
  --muted:#b4b4b4;
  --accent:#14b789;
  --accent-hover:#16cc99;
  --accent-soft:#6ce0b8;
  --accent-dim:rgba(20,183,137,.14);
  --warn-text:#e0b05c;
  --danger:#e06c75;

  /* --- new: register-specific --- */
  --bg-deep:#131313;          /* the surface behind the table */
  --row-hover:#232323;
  --row-sel:rgba(20,183,137,.10);
  --grid:#2f2f2f;             /* hairlines inside the table only */
  --muted2:#8a8a8a;

  /* item-type hues — deliberately NOT the emerald accent, which stays
     reserved for interface affordances (active tab, primary action) */
  --t-decision:#7fb3d5;       /* harbour blue  */
  --t-action:#e0b05c;         /* buoy amber    */
  --t-question:#b79ce0;       /* violet        */
  --t-risk:#e06c75;           /* signal red    */
  --t-info:#9a9a9a;           /* slate         */

  /* review state */
  --ai:#7a6fa8;
  --ok:#14b789;

  --mono:ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,Consolas,monospace;
  --ui:"Hellix","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,
       "Hiragino Sans","Microsoft YaHei",sans-serif;

  --r:8px;
  --r-pill:999px;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg-deep);
  color:var(--text);
  font-family:var(--ui);
  font-size:13px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-soft);outline-offset:1px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- app shell ---------- */
.app{display:flex;flex-direction:column;height:100vh;min-height:100vh}

/* ---------- meeting header ---------- */
.mhead{
  background:var(--bg);
  border-bottom:1px solid var(--border);
  padding:12px 16px 0;
  flex-shrink:0;
}
.mhead-top{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.brandmark{
  display:flex;align-items:center;gap:8px;
  font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;
  flex-shrink:0;padding-top:3px;
}
.brandmark b{color:var(--text);font-weight:600;letter-spacing:-.01em;text-transform:none;font-size:13px}
.mtitle-wrap{flex:1;min-width:240px}
h1{
  font-size:17px;font-weight:600;letter-spacing:-.015em;line-height:1.3;
  text-wrap:balance;
}
.mfacts{
  display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:4px;
  font-size:11.5px;color:var(--muted);
}
.mfacts span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.mfacts .k{color:var(--muted2)}
.mfacts .v{color:var(--text2)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.head-actions{display:flex;gap:6px;align-items:center;flex-shrink:0}

/* provenance banner — replaces Loop's flat "AI-generated content" line */
.prov{
  display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  margin:10px 0 0;padding:7px 10px;
  background:rgba(122,111,168,.10);
  border:1px solid rgba(122,111,168,.35);
  border-radius:var(--r);
  font-size:11.5px;color:#cdc6e4;
}
.prov b{color:#e2dcf2;font-weight:600}
.prov .sep{color:#6b6383}

/* ---------- coverage strip ---------- */
.strip{
  display:flex;gap:0;margin-top:10px;
  border:1px solid var(--border);border-bottom:none;
  border-radius:var(--r) var(--r) 0 0;
  background:var(--card);
  overflow-x:auto;
}
.stat{
  flex:1 0 auto;min-width:104px;padding:9px 12px;
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;gap:1px;
}
.stat:last-child{border-right:none}
.stat .n{font-family:var(--mono);font-size:19px;font-weight:600;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums}
.stat .l{font-size:10.5px;color:var(--muted2);text-transform:uppercase;letter-spacing:.06em}
.stat.is-alert .n{color:var(--danger)}
.stat.is-warn .n{color:var(--warn-text)}
.stat.is-ok .n{color:var(--accent)}
.stat .bar{display:block;height:4px;border-radius:2px;background:#333;margin-top:6px;overflow:hidden;max-width:160px}
.stat .bar i{display:block;height:100%;background:var(--accent);border-radius:2px}

/* ---------- view tabs + toolbar ---------- */
.bar{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:8px 16px;background:var(--bg);
  border-bottom:1px solid var(--border);flex-shrink:0;
}
.tabs{display:inline-flex;background:var(--card3);border:1px solid var(--border);border-radius:var(--r-pill);padding:2px}
.tabs button{
  border:none;background:none;color:var(--muted);
  padding:4px 11px;border-radius:var(--r-pill);cursor:pointer;
  font-size:12px;white-space:nowrap;
}
.tabs button[aria-selected="true"]{background:var(--accent);color:#fff;font-weight:600}
.tabs button:hover:not([aria-selected="true"]){color:var(--text2)}

.spacer{flex:1}

.srch{
  position:relative;display:flex;align-items:center;
  background:var(--card2);border:1px solid var(--border);border-radius:var(--r-pill);
  padding:0 10px;height:28px;min-width:150px;
}
.srch input{background:none;border:none;outline:none;width:100%;font-size:12px}
.srch input::placeholder{color:var(--muted2)}
.srch span{color:var(--muted2);font-size:11px;margin-right:6px}

.btn{
  background:var(--card2);border:1px solid var(--border);color:var(--text2);
  height:28px;padding:0 11px;border-radius:var(--r-pill);cursor:pointer;font-size:12px;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  transition:background .12s ease,border-color .12s ease;
}
.btn:hover{background:var(--card3);border-color:#4a4a4a}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.on{background:var(--accent-dim);border-color:rgba(20,183,137,.5);color:var(--accent-soft)}

.langsw{display:inline-flex;border:1px solid var(--border);border-radius:var(--r-pill);overflow:hidden;height:28px}
.langsw button{
  border:none;background:var(--card2);color:var(--muted);
  padding:0 10px;cursor:pointer;font-size:11.5px;font-weight:600;letter-spacing:.03em;
}
.langsw button[aria-pressed="true"]{background:var(--accent);color:#fff}

/* filter chips row */
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:7px 16px;border-bottom:1px solid var(--border);background:var(--bg);flex-shrink:0}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--border);background:var(--card2);color:var(--muted);
  border-radius:var(--r-pill);padding:3px 9px 3px 7px;font-size:11.5px;cursor:pointer;
}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0}
.chip .ct{font-family:var(--mono);font-size:10.5px;color:var(--muted2)}
.chip[aria-pressed="true"]{background:var(--card3);color:var(--text);border-color:#4d4d4d}
.chip[data-type="decision"]{--c:var(--t-decision)}
.chip[data-type="action"]{--c:var(--t-action)}
.chip[data-type="question"]{--c:var(--t-question)}
.chip[data-type="risk"]{--c:var(--t-risk)}
.chip[data-type="info"]{--c:var(--t-info)}
.chip .dot{background:var(--c,var(--muted))}
.chip[aria-pressed="true"] .ct{color:var(--text2)}

/* ---------- main region ---------- */
.main{flex:1;display:flex;min-height:0;overflow:hidden}
.pane{flex:1;min-width:0;overflow:auto;background:var(--bg-deep)}

/* ---------- the register table ---------- */
table{border-collapse:separate;border-spacing:0;width:100%;min-width:940px}
thead th{
  position:sticky;top:0;z-index:3;
  background:var(--card);
  border-bottom:1px solid var(--border);
  text-align:left;padding:7px 10px;
  font-size:10.5px;font-weight:600;color:var(--muted2);
  text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;
  cursor:pointer;user-select:none;
}
thead th:hover{color:var(--text2)}
thead th .sort{color:var(--accent);font-size:9px}
tbody td{
  border-bottom:1px solid var(--grid);
  padding:8px 10px;vertical-align:top;
}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--row-hover)}
tbody tr[aria-selected="true"] td{background:var(--row-sel)}
tbody tr[aria-selected="true"] td:first-child{box-shadow:inset 2px 0 0 var(--accent)}

.c-id{width:78px}
.c-type{width:104px}
.c-topic{width:120px}
.c-owner{width:132px}
.c-due{width:92px}
.c-status{width:104px}
.c-src{width:78px}

.id{font-family:var(--mono);font-size:11px;color:var(--muted2);white-space:nowrap}
.id.carried::after{
  content:"↩";color:var(--warn-text);margin-left:4px;font-family:var(--ui);
}

/* type is a left severity rail + label, not a rounded pill on everything */
.type{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;white-space:nowrap}
.type i{width:3px;height:14px;border-radius:2px;background:var(--c);flex-shrink:0}
.type[data-type="decision"]{--c:var(--t-decision);color:var(--t-decision)}
.type[data-type="action"]{--c:var(--t-action);color:var(--t-action)}
.type[data-type="question"]{--c:var(--t-question);color:var(--t-question)}
.type[data-type="risk"]{--c:var(--t-risk);color:var(--t-risk)}
.type[data-type="info"]{--c:var(--t-info);color:var(--t-info)}

.topic{
  display:inline-block;font-size:10.5px;color:var(--muted);
  background:var(--card2);border:1px solid var(--border);
  border-radius:4px;padding:1px 6px;white-space:nowrap;
}
.itemtext{color:var(--text2);max-width:640px}
.itemtext .agenda{
  font-family:var(--mono);font-size:10px;color:var(--muted2);
  margin-right:6px;
}
.itemtext .alt{display:block;color:var(--muted2);font-size:11.5px;margin-top:2px;font-style:italic}
.owner{display:flex;align-items:center;gap:6px;min-width:0}
.av{
  width:20px;height:20px;border-radius:50%;flex-shrink:0;
  display:grid;place-items:center;font-size:9.5px;font-weight:700;color:#12160f;
  font-family:var(--mono);
}
.owner .nm{font-size:12px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.owner .org{font-size:10px;color:var(--muted2)}
.due{font-family:var(--mono);font-size:11.5px;color:var(--text2);white-space:nowrap;font-variant-numeric:tabular-nums}
.due.over{color:var(--danger);font-weight:600}
.due.soon{color:var(--warn-text)}
.due .rel{display:block;font-size:10px;color:var(--muted2);font-family:var(--ui)}

.status{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;white-space:nowrap}
.status .sd{width:8px;height:8px;border-radius:50%;flex-shrink:0;border:1.5px solid var(--c)}
.status[data-s="open"]{--c:var(--muted)}
.status[data-s="progress"]{--c:var(--warn-text);color:var(--warn-text)}
.status[data-s="progress"] .sd{background:linear-gradient(90deg,var(--warn-text) 50%,transparent 50%)}
.status[data-s="closed"]{--c:var(--accent);color:var(--accent)}
.status[data-s="closed"] .sd{background:var(--accent)}
.status[data-s="carried"]{--c:var(--t-question);color:var(--t-question)}
.status[data-s="carried"] .sd{background:var(--t-question)}

.src{
  font-family:var(--mono);font-size:11px;color:var(--muted2);
  display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
}
.src:hover{color:var(--accent-soft)}
.src .play{font-size:8px}
.conf{
  display:block;width:34px;height:3px;border-radius:2px;background:var(--card3);
  margin-top:4px;overflow:hidden;
}
.conf i{display:block;height:100%;border-radius:2px}
.rev{font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;margin-top:3px;display:block}
.rev[data-r="ai"]{color:var(--ai)}
.rev[data-r="accepted"]{color:var(--ok)}
.rev[data-r="edited"]{color:var(--muted2)}

/* ---------- grouped (by topic) view ---------- */
.grp{padding:0 0 24px}
.grp h2{
  position:sticky;top:0;z-index:2;
  display:flex;align-items:baseline;gap:10px;
  background:var(--bg);border-bottom:1px solid var(--border);
  padding:8px 16px;font-size:12px;font-weight:600;letter-spacing:.01em;
}
.grp h2 .cnt{font-family:var(--mono);font-size:11px;color:var(--muted2);font-weight:400}
.grp h2 .cov{margin-left:auto;font-size:10.5px;font-weight:400}
.gcard{
  display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;
  padding:10px 16px;border-bottom:1px solid var(--grid);cursor:pointer;
}
.gcard:hover{background:var(--row-hover)}
.gcard .gmeta{display:flex;flex-direction:column;gap:4px;align-items:flex-end;text-align:right}

/* ---------- document (minutes) view ---------- */
.doc{max-width:72ch;margin:0 auto;padding:28px 24px 64px}
.doc h2{
  font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted2);
  border-bottom:1px solid var(--border);padding-bottom:5px;margin:26px 0 12px;font-weight:600;
}
.doc h2:first-child{margin-top:0}
.doc p{color:var(--text2);margin-bottom:10px}
.doc ul{list-style:none;display:flex;flex-direction:column;gap:8px}
.doc li{display:flex;gap:9px;align-items:baseline}
.doc li i{width:3px;align-self:stretch;border-radius:2px;flex-shrink:0;background:var(--c,var(--muted))}
.doc li[data-type="decision"]{--c:var(--t-decision)}
.doc li[data-type="action"]{--c:var(--t-action)}
.doc li[data-type="question"]{--c:var(--t-question)}
.doc li[data-type="risk"]{--c:var(--t-risk)}
.doc li[data-type="info"]{--c:var(--t-info)}
.doc li .tail{font-family:var(--mono);font-size:10.5px;color:var(--muted2);white-space:nowrap}
.doc .sig{
  margin-top:32px;padding-top:14px;border-top:1px solid var(--border);
  font-size:11px;color:var(--muted2);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;
}

/* ---------- carry-forward view ---------- */
.cf{padding:16px}
.cf-intro{color:var(--muted);font-size:12px;margin-bottom:14px;max-width:64ch}
.cf-list{display:flex;flex-direction:column;gap:8px}
.cfrow{
  display:grid;grid-template-columns:4px 1fr auto;gap:12px;align-items:center;
  background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  padding:10px 12px 10px 0;overflow:hidden;
}
.cfrow>.age-rail{height:100%;min-height:42px;background:var(--warn-text);border-radius:0}
.cfrow.hot>.age-rail{background:var(--danger)}
.cfrow .cfmain{min-width:0;padding-left:12px}
.cfrow .cfmain .t{color:var(--text2);margin-bottom:3px}
.cfrow .cfmain .m{font-size:11px;color:var(--muted2);font-family:var(--mono)}
.cfrow .cfact{display:flex;gap:6px;flex-shrink:0}

/* ---------- detail drawer ---------- */
.drawer{
  width:min(400px,42vw);flex-shrink:0;
  border-left:1px solid var(--border);background:var(--card);
  display:flex;flex-direction:column;overflow:hidden;
}
.drawer[hidden]{display:none!important}
.dhead{
  padding:12px 14px;border-bottom:1px solid var(--border);
  display:flex;align-items:flex-start;gap:10px;flex-shrink:0;
}
.dhead .x{background:none;border:none;color:var(--muted2);cursor:pointer;font-size:16px;line-height:1;padding:2px 4px}
.dhead .x:hover{color:var(--text)}
.dbody{overflow:auto;padding:14px;display:flex;flex-direction:column;gap:16px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld>label{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted2);font-weight:600}
.fld input,.fld select,.fld textarea{
  background:var(--card2);border:1px solid var(--border);border-radius:6px;
  padding:6px 8px;font-size:12.5px;width:100%;outline:none;resize:vertical;
}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent);background:var(--card3)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* provenance block — the thing Loop cannot do */
.quote{
  background:var(--bg-deep);border:1px solid var(--border);border-radius:var(--r);
  padding:10px 12px;position:relative;
}
.quote .qh{
  display:flex;align-items:center;gap:8px;margin-bottom:7px;
  font-size:11px;color:var(--muted2);flex-wrap:wrap;
}
.quote .qh .tc{font-family:var(--mono);color:var(--accent-soft);cursor:pointer}
.quote .qt{color:var(--text2);font-size:12.5px;line-height:1.55}
.quote .qt.orig{padding-bottom:8px;margin-bottom:8px;border-bottom:1px dashed var(--border)}
.quote .lbl{font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted2);display:block;margin-bottom:3px}
.wave{
  display:flex;align-items:flex-end;gap:1.5px;height:22px;margin-top:9px;
}
.wave i{flex:1;background:var(--card3);border-radius:1px;min-height:2px}
.wave i.in{background:var(--accent);opacity:.55}

.dfoot{
  border-top:1px solid var(--border);padding:10px 14px;display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap;
}

/* ---------- toast ---------- */
.toast{
  position:fixed;bottom:16px;left:50%;transform:translateX(-50%) translateY(8px);
  background:var(--card3);border:1px solid var(--border);border-radius:var(--r-pill);
  padding:8px 16px;font-size:12px;color:var(--text2);
  opacity:0;pointer-events:none;transition:opacity .16s ease,transform .16s ease;z-index:50;
  box-shadow:0 6px 22px rgba(0,0,0,.45);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.empty{padding:40px 16px;text-align:center;color:var(--muted2);font-size:12.5px}

/* ---------- narrow / side-panel mode ---------- */
@media (max-width:860px){
  .drawer{
    position:fixed;inset:0;width:100%;z-index:40;border-left:none;
  }
  .c-topic,.c-src,.c-owner{display:none}
  table{min-width:0}
  .itemtext{max-width:none}
  .mfacts .opt{display:none}
}
@media (max-width:620px){
  thead{display:none}
  table,tbody,tr,td{display:block;width:auto}
  tbody tr{
    border-bottom:1px solid var(--grid);padding:10px 14px;
    display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:baseline;
  }
  tbody tr:hover td{background:none}
  tbody td{border:none;padding:0}
  td.c-id{grid-row:1;grid-column:1}
  td.c-type{grid-row:1;grid-column:2}
  td.c-item{grid-row:2;grid-column:1/-1}
  td.c-due,td.c-status{grid-row:3;display:inline-block}
  td.c-due{grid-column:1}
  td.c-status{grid-column:2}
}
</style>
</head>
<body>
<div class="app">

  <!-- ============ meeting header ============ -->
  <header class="mhead">
    <div class="mhead-top">
      <div class="brandmark"><b>yraverageSubMin</b><span>·</span><span data-t="minutes">Minutes</span></div>
      <div class="mtitle-wrap">
        <h1 id="m-title">CPOC Phase 7 — GZS Weekly Progress Meeting</h1>
        <div class="mfacts">
          <span><span class="k" data-t="date">Date</span> <span class="v mono">2026-09-02</span></span>
          <span><span class="k" data-t="time">Time</span> <span class="v mono">10:00–12:00 GMT+8</span></span>
          <span><span class="k" data-t="chair">Chair</span> <span class="v">Nasmee Samang</span></span>
          <span class="opt"><span class="k" data-t="present">Present</span> <span class="v mono">9</span></span>
          <span class="opt"><span class="k" data-t="mom">MoM</span> <span class="v mono">MOM-CPOC7-W36</span></span>
        </div>
      </div>
      <div class="head-actions">
        <button class="btn" id="btn-export">⤓ <span data-t="export">Export</span></button>
        <button class="btn primary" id="btn-issue">✓ <span data-t="issue">Issue MoM</span></button>
      </div>
    </div>

    <div class="prov">

/* ==========================================================================
   3. View state
   ========================================================================== */
const state = {
  view:"table", q:"", types:new Set(), mine:false, dual:false,
  sort:{key:"id", dir:1}, sel:null, me:"Riza",
};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const txt = it => it[LANG] ?? it.en;
const topicName = k => (TOPICS[k] ? TOPICS[k][LANG] ?? TOPICS[k].en : k);

function daysTo(iso){
  if(!iso) return null;
  return Math.round((new Date(iso+"T00:00:00Z") - TODAY)/86400000);
}
function dueClass(it){
  if(!it.due || it.status==="closed") return "";
  const d = daysTo(it.due);
  if(d < 0) return "over";
  if(d <= 3) return "soon";
  return "";
}
function relLabel(it){
  if(!it.due) return "";
  if(it.status==="closed") return "";
  const d = daysTo(it.due);
  if(d === 0) return T("today");
  if(d < 0) return `${Math.abs(d)}${T("days")} ${T("overdue")}`;
  return `${T("dueIn")} ${d}${T("days")}`;
}
function initials(n){
  return n.split(/[\s\/]+/).map(w=>w[0]).join("").slice(0,2).toUpperCase();
}

function filtered(){
  const q = state.q.trim().toLowerCase();
  return ITEMS.filter(it=>{
    if(state.types.size && !state.types.has(it.type)) return false;
    if(state.mine && it.owner !== state.me) return false;
    if(q){
      const hay = [it.ref, it.en, it.id, it.owner, it.src.speaker, it.src.tr].join(" ").toLowerCase();
      if(!hay.includes(q) && !String(it[LANG]||"").toLowerCase().includes(q)) return false;
    }
    return true;
  });
}
function sorted(rows){
  const {key,dir} = state.sort;
  const val = it => {
    if(key==="due") return it.due || "9999";
    if(key==="type") return it.type;
    if(key==="owner") return it.owner || "zzz";
    if(key==="status") return it.status;
    if(key==="topic") return it.topic;
    return it.ref;
  };
  return [...rows].sort((a,b)=> (val(a) > val(b) ? 1 : val(a) < val(b) ? -1 : 0) * dir);
}

  const covered = AGENDA.filter(a=>a.covered).length;
  const pct = Math.round(covered/AGENDA.length*100);

  $("#prov-unreviewed").textContent = unrev.length;

  const cells = [
    {n:ITEMS.length, l:T("total")},
    {n:`${openActs.length}/${acts.length}`, l:T("actions")},
    {n:overdue.length, l:T("overdueL"), cls: overdue.length ? "is-alert" : "is-ok"},
    {n:ITEMS.filter(i=>i.type==="decision").length, l:T("decisions")},
    {n:ITEMS.filter(i=>i.type==="question"&&i.status!=="closed").length, l:T("questions")},
    {n:unrev.length, l:T("review"), cls: unrev.length ? "is-warn" : "is-ok"},
    {n:`${pct}%`, l:T("coverage"), bar:pct},
  ];
  $("#strip").innerHTML = cells.map(c=>`
    <div class="stat ${c.cls||""}">
      <span class="n">${esc(c.n)}</span>
      <span class="l">${esc(c.l)}</span>
      ${c.bar!=null ? `<span class="bar"><i style="width:${c.bar}%"></i></span>` : ""}
    </div>`).join("");
}

function paintChips(){
  const types = ["decision","action","question","risk","info"];
  $("#chips").innerHTML = types.map(t=>{
    const n = ITEMS.filter(i=>i.type===t).length;
    const on = state.types.has(t);
    return `<button class="chip" data-type="${t}" aria-pressed="${on}">
      <span class="dot"></span>${esc(T(t))}<span class="ct">${n}</span></button>`;
  }).join("");
}

/* ==========================================================================
   5. Views
   ========================================================================== */
function cellType(it){
  return `<span class="type" data-type="${it.type}"><i></i>${esc(T(it.type))}</span>`;
}
function cellOwner(it){
  if(!it.owner) return `<span class="owner"><span class="nm" style="color:var(--muted2)">${esc(T("noOwner"))}</span></span>`;
  const p = PEOPLE[it.owner] || {org:"", c:"#9a9a9a"};
  return `<span class="owner">
    <span class="av" style="background:${p.c}">${esc(initials(it.owner))}</span>
    <span style="min-width:0"><span class="nm">${esc(it.owner)}</span>
    <span class="org">${esc(p.org)}</span></span></span>`;
}
function cellDue(it){
  if(!it.due) return `<span class="due" style="color:var(--muted2)">${esc(T("noDue"))}</span>`;
  return `<span class="due ${dueClass(it)}">${esc(it.due.slice(5))}<span class="rel">${esc(relLabel(it))}</span></span>`;
}
function cellStatus(it){
  return `<span class="status" data-s="${it.status}"><span class="sd"></span>${esc(T(it.status))}</span>`;
}
function confColor(c){ return c >= .9 ? "var(--accent)" : c >= .82 ? "var(--warn-text)" : "var(--danger)"; }
function cellSrc(it){
  return `<span class="src" data-play="${esc(it.src.t)}"><span class="play">▶</span>${esc(it.src.t)}
    <span class="conf" title="ASR ${Math.round(it.conf*100)}%"><i style="width:${it.conf*100}%;background:${confColor(it.conf)}"></i></span>
    </span><span class="rev" data-r="${it.review}">${esc(T(it.review))}</span>`;
}
function cellItem(it){
  const alt = state.dual ? `<span class="alt">${esc(LANG==="en" ? it.id : it.en)}</span>` : "";
  return `<span class="itemtext"><span class="agenda">${esc(it.agenda)}</span>${esc(txt(it))}${alt}</span>`;
}

function viewTable(rows){
  if(!rows.length) return `<p class="empty">${esc(T("emptyF"))}</p>`;
  const th = (k,cls,label)=>{
    const active = state.sort.key===k;
    return `<th class="${cls}" data-sort="${k}">${esc(label)}${active?`<span class="sort">${state.sort.dir>0?"▲":"▼"}</span>`:""}</th>`;
  };
  return `<table>
    <thead><tr>
      ${th("id","c-id",T("cId"))}
      ${th("type","c-type",T("cType"))}
      ${th("topic","c-topic",T("cTopic"))}
      <th class="c-item">${esc(T("cItem"))}</th>
      ${th("owner","c-owner",T("cOwner"))}
      ${th("due","c-due",T("cDue"))}
      ${th("status","c-status",T("cStatus"))}
      <th class="c-src">${esc(T("cSrc"))}</th>
    </tr></thead>
    <tbody>${rows.map(it=>`
      <tr data-ref="${esc(it.ref)}" aria-selected="${state.sel===it.ref}">
        <td class="c-id"><span class="id ${it.carriedFrom?"carried":""}">${esc(it.ref)}</span></td>
        <td class="c-type">${cellType(it)}</td>
        <td class="c-topic"><span class="topic">${esc(topicName(it.topic))}</span></td>
        <td class="c-item">${cellItem(it)}</td>
        <td class="c-owner">${cellOwner(it)}</td>
        <td class="c-due">${cellDue(it)}</td>
        <td class="c-status">${cellStatus(it)}</td>
        <td class="c-src">${cellSrc(it)}</td>
      </tr>`).join("")}</tbody>
  </table>`;
}

function viewTopic(rows){
  const keys = Object.keys(TOPICS).filter(k=>rows.some(r=>r.topic===k));
  if(!keys.length) return `<p class="empty">${esc(T("emptyF"))}</p>`;
  return `<div class="grp">${keys.map(k=>{
    const rs = rows.filter(r=>r.topic===k);
    const openN = rs.filter(r=>r.status!=="closed").length;
    return `<h2>${esc(topicName(k))}<span class="cnt">${rs.length}</span>
      <span class="cov" style="color:${openN?"var(--warn-text)":"var(--accent)"}">${openN} ${esc(T("open")).toLowerCase()}</span></h2>
      ${rs.map(it=>`
        <div class="gcard" data-ref="${esc(it.ref)}">
          <div>${cellType(it)}<div class="id ${it.carriedFrom?"carried":""}" style="margin-top:4px">${esc(it.ref)}</div></div>
          <div>${cellItem(it)}<div style="margin-top:6px">${cellOwner(it)}</div></div>
          <div class="gmeta">${cellStatus(it)}${cellDue(it)}</div>
        </div>`).join("")}`;
  }).join("")}</div>`;
}

function viewDoc(rows){
  const sec = (title, type) => {
    const rs = rows.filter(r=>r.type===type);
    if(!rs.length) return "";
    return `<h2>${esc(title)}</h2><ul>${rs.map(it=>`
      <li data-type="${it.type}" data-ref="${esc(it.ref)}">
        <i></i>
        <span>${esc(txt(it))}
          ${it.owner||it.due ? `<span class="tail"> — ${esc(it.owner||T("noOwner"))}${it.due?` · ${esc(it.due)}`:""}</span>`:""}
        </span>
      </li>`).join("")}</ul>`;
  };
  const openActs = rows.filter(r=>r.type==="action"&&r.status!=="closed").length;
  return `<div class="doc">
    <h2>${esc(T("docSum"))}</h2>
    <p>${LANG==="en"
      ? `The meeting opened on the dropped-object incident during conductor installation and closed on yard-audit readiness. Crane inspection and securement controls were agreed as standing requirements covering transport as well as operation. Document review is progressing under MDR/GMDR priority with no issues flagged; two MWS signatures remain outstanding. Vessel selection and the marine budget stay open pending the C900 evaluation. ${openActs} action items are open, three of them carried from week 35.`
      : `Rapat dibuka dengan insiden dropped object saat instalasi conductor dan ditutup dengan kesiapan audit yard. Kendali inspeksi dan pengamanan crane disepakati sebagai persyaratan tetap yang mencakup transportasi, bukan hanya operasi. Tinjauan dokumen berjalan sesuai prioritas MDR/GMDR tanpa isu; dua tanda tangan MWS masih tertunda. Pemilihan kapal dan anggaran marine tetap terbuka menunggu evaluasi C900. ${openActs} tindak lanjut masih terbuka, tiga di antaranya bawaan dari minggu 35.`}</p>
    ${sec(T("docDec"),"decision")}
    ${sec(T("docAct"),"action")}
    ${sec(T("docQ"),"question")}
    ${sec(T("docRisk"),"risk")}
    ${sec(T("docNote"),"info")}
    <div class="sig">
      <span>${esc(T("prepared"))}: yraverageSubMin · on-device · 2026-09-02 12:14</span>
      <span>${esc(T("nextMtg"))}: 2026-09-09 10:00 GMT+8</span>
    </div>
  </div>`;
}

function viewCarry(){
  const rs = ITEMS.filter(i=>i.carriedFrom);
  return `<div class="cf">
    <p class="cf-intro">${esc(T("carryIntro"))}</p>
    <div class="cf-list">${rs.map(it=>{
      const age = Math.round((TODAY - new Date(it.opened+"T00:00:00Z"))/86400000);
      return `<div class="cfrow ${age>14?"hot":""}" data-ref="${esc(it.ref)}">
        <span class="age-rail"></span>
        <div class="cfmain">
          <div class="t">${cellType(it)} ${esc(txt(it))}</div>
          <div class="m">${esc(it.ref)} · ${esc(it.carriedFrom)} · ${esc(T("age"))} ${age}${esc(T("days"))} · ${esc(it.owner||T("noOwner"))}</div>
        </div>
        <div class="cfact">
          <button class="btn primary" data-carry="${esc(it.ref)}">↳ ${esc(T("carryIn"))}</button>
          <button class="btn" data-close="${esc(it.ref)}">✓ ${esc(T("closeIt"))}</button>
        </div>
      </div>`;
    }).join("")}</div>
  </div>`;
}

function paint(){
  document.querySelectorAll("[data-t]").forEach(el=>{ el.textContent = T(el.dataset.t); });
  document.documentElement.lang = LANG;
  paintStrip(); paintChips();

  const rows = sorted(filtered());
  const pane = $("#pane");
  pane.innerHTML =
    state.view==="table" ? viewTable(rows) :
    state.view==="topic" ? viewTopic(rows) :
    state.view==="doc"   ? viewDoc(rows)   :
                           viewCarry();
  if(state.sel) paintDrawer();
}

/* ==========================================================================
   6. Detail drawer — provenance is the point
   ========================================================================== */
function paintDrawer(){
  const it = ITEMS.find(i=>i.ref===state.sel);
  const dr = $("#drawer");
  if(!it){ dr.hidden = true; return; }
  dr.hidden = false;
  $("#d-id").innerHTML = `${esc(it.ref)}${it.carriedFrom?` <span style="color:var(--warn-text)">↩ ${esc(it.carriedFrom)}</span>`:""}`;
  $("#d-type").innerHTML = cellType(it);

  const bars = Array.from({length:44},(_,i)=>{
    const h = 20 + 80*Math.abs(Math.sin(i*1.7)*Math.cos(i*.6));
    return `<i class="${i>12&&i<32?"in":""}" style="height:${h}%"></i>`;
  }).join("");

  $("#d-body").innerHTML = `
    <div class="fld">
      <label>${esc(T("dText"))}</label>
      <textarea rows="4" id="f-text">${esc(txt(it))}</textarea>
    </div>
    <div class="two">
      <div class="fld"><label>${esc(T("dOwner"))}</label>
        <select id="f-owner">
          <option value="">${esc(T("noOwner"))}</option>
          ${Object.keys(PEOPLE).map(p=>`<option ${p===it.owner?"selected":""}>${esc(p)}</option>`).join("")}
        </select></div>
      <div class="fld"><label>${esc(T("dDue"))}</label>
        <input type="date" id="f-due" value="${esc(it.due||"")}" /></div>
    </div>
    <div class="two">
      <div class="fld"><label>${esc(T("dStatus"))}</label>
        <select id="f-status">
          ${["open","progress","closed","carried"].map(s=>`<option value="${s}" ${s===it.status?"selected":""}>${esc(T(s))}</option>`).join("")}
        </select></div>
      <div class="fld"><label>${esc(T("dTopic"))}</label>
        <select id="f-topic">
          ${Object.keys(TOPICS).map(k=>`<option value="${k}" ${k===it.topic?"selected":""}>${esc(topicName(k))}</option>`).join("")}
        </select></div>
    </div>

    <div class="fld">
      <label>${esc(T("dProv"))}</label>
      <div class="quote">
        <div class="qh">
          <span class="tc" data-play="${esc(it.src.t)}">▶ ${esc(it.src.t)}</span>
          <span>·</span><span>${esc(it.src.speaker)}</span>
          ${it.src.meeting?`<span>·</span><span class="mono">${esc(it.src.meeting)}</span>`:""}
          <span style="margin-left:auto" class="mono">ASR ${Math.round(it.conf*100)}%</span>
        </div>
        <div class="qt orig"><span class="lbl">${esc(T("sOriginal"))}</span>${esc(it.src.orig)}</div>
        <div class="qt"><span class="lbl">${esc(T("sTranslated"))}</span>${esc(it.src.tr)}</div>
        <div class="wave">${bars}</div>
      </div>
    </div>`;

  $("#d-foot").innerHTML = `
    <button class="btn primary" id="d-accept">✓ ${esc(T(it.review==="ai"?"accept":"editS"))}</button>
    <button class="btn" id="d-play">▶ ${esc(T("jump"))}</button>
    <span class="spacer"></span>
    <button class="btn" id="d-reject" style="color:var(--danger)">${esc(T("reject"))}</button>`;
}

/* ==========================================================================
   7. Events
   ========================================================================== */
let toastTimer;
function toast(msg){
  const el = $("#toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>el.classList.remove("show"), 2200);
}

$("#tabs").addEventListener("click", e=>{
  const b = e.target.closest("button[data-view]"); if(!b) return;
  state.view = b.dataset.view;
  [...$("#tabs").children].forEach(x=>x.setAttribute("aria-selected", x===b));
  paint();
});

$("#chips").addEventListener("click", e=>{
  const c = e.target.closest(".chip"); if(!c) return;
  const t = c.dataset.type;
  state.types.has(t) ? state.types.delete(t) : state.types.add(t);
  paint();
});

$("#q").addEventListener("input", e=>{ state.q = e.target.value; paint(); });

$("#btn-mine").addEventListener("click", e=>{
  state.mine = !state.mine;
  e.currentTarget.setAttribute("aria-pressed", state.mine);
  e.currentTarget.classList.toggle("on", state.mine);
  paint();
});
$("#btn-dual").addEventListener("click", e=>{
  state.dual = !state.dual;
  e.currentTarget.setAttribute("aria-pressed", state.dual);
  e.currentTarget.classList.toggle("on", state.dual);
  paint();
});

document.querySelector(".langsw").addEventListener("click", e=>{
  const b = e.target.closest("button[data-lang]"); if(!b) return;
  LANG = b.dataset.lang;
  [...b.parentNode.children].forEach(x=>x.setAttribute("aria-pressed", x===b));
  paint();
});

$("#pane").addEventListener("click", e=>{
  const play = e.target.closest("[data-play]");
  if(play){ e.stopPropagation(); toast(`${T("toastPlay")} ${play.dataset.play}`); return; }

  const carry = e.target.closest("[data-carry]");
  if(carry){
    const it = ITEMS.find(i=>i.ref===carry.dataset.carry);
    if(it){ it.status="open"; it.ref = "W36-0" + (20 + ITEMS.filter(x=>x.ref.startsWith("W36")).length); it.carriedInFrom = it.carriedFrom; delete it.carriedFrom; }
    toast(T("toastCarry")); paint(); return;
  }
  const close = e.target.closest("[data-close]");
  if(close){
    const it = ITEMS.find(i=>i.ref===close.dataset.close);
    if(it) it.status = "closed";
    paint(); return;
  }
  const th = e.target.closest("th[data-sort]");
  if(th){
    const k = th.dataset.sort;
    state.sort = {key:k, dir: state.sort.key===k ? -state.sort.dir : 1};
    paint(); return;
  }
  const row = e.target.closest("[data-ref]");
  if(row){ state.sel = row.dataset.ref; paint(); }
});

$("#d-close").addEventListener("click", ()=>{ state.sel=null; $("#drawer").hidden=true; paint(); });

$("#drawer").addEventListener("click", e=>{
  const it = ITEMS.find(i=>i.ref===state.sel); if(!it) return;
  if(e.target.closest("[data-play]")) { toast(`${T("toastPlay")} ${it.src.t}`); return; }
  if(e.target.closest("#d-accept")){
    it.review = it.review==="ai" ? "accepted" : "edited";
    it[LANG] = $("#f-text").value;
    it.owner = $("#f-owner").value || null;
    it.due   = $("#f-due").value || null;
    it.status= $("#f-status").value;
    it.topic = $("#f-topic").value;
    toast(T("toastAccept")); paint(); return;
  }
  if(e.target.closest("#d-reject")){
    const i = ITEMS.indexOf(it); if(i>-1) ITEMS.splice(i,1);
    state.sel = null; $("#drawer").hidden = true; paint(); return;
  }
});

$("#btn-export").addEventListener("click", ()=>toast(T("toastExport")));
$("#btn-issue").addEventListener("click", ()=>toast(T("toastIssue")));

document.addEventListener("keydown", e=>{
  if(e.key==="Escape" && state.sel){ state.sel=null; $("#drawer").hidden=true; paint(); }
  if(e.key==="/" && document.activeElement!==$("#q")){ e.preventDefault(); $("#q").focus(); }
});

paint();
</script>
</body>
</html>
